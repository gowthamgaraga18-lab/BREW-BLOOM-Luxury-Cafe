name: Inspect BREW & BLOOM project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect project
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar' \) -print -quit)"
          test -n "$archive"
          mkdir extracted
          if tar -tzf "$archive" >/dev/null 2>&1; then tar -xzf "$archive" -C extracted; else tar -xf "$archive" -C extracted; fi
          root="$(find extracted -name package.json -print -quit | xargs dirname)"
          echo "PROJECT_ROOT=$root"
          echo "----- package.json -----"
          cat "$root/package.json"
          echo "----- next.config -----"
          for f in "$root"/next.config.*; do [ -f "$f" ] && cat "$f"; done
          echo "----- README -----"
          if [ -f "$root/README.md" ]; then head -120 "$root/README.md"; fi
