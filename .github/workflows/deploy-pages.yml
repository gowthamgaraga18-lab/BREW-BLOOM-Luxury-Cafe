name: Prepare BREW & BLOOM source for deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-source:
    if: ${{ !contains(github.event.head_commit.message, 'Extract project source files') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract project source safely
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            echo "Project source is already present at repository root."
            exit 0
          fi

          archive="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.tar' \) -print -quit)"
          if [ -z "$archive" ]; then
            echo "No project archive found in the repository root."
            exit 1
          fi

          mkdir extracted
          if tar -tzf "$archive" >/dev/null 2>&1; then
            listing="$(tar -tzf "$archive")"
            tar -xzf "$archive" -C extracted --no-same-owner --no-same-permissions
          else
            listing="$(tar -tf "$archive")"
            tar -xf "$archive" -C extracted --no-same-owner --no-same-permissions
          fi

          while IFS= read -r item; do
            case "$item" in
              /*|../*|*/../*|..)
                echo "Unsafe archive path detected: $item"
                exit 1
                ;;
            esac
          done <<< "$listing"

          project_root="$(find extracted -name package.json -not -path '*/node_modules/*' -print -quit | xargs dirname)"
          if [ -z "$project_root" ] || [ ! -f "$project_root/next.config.ts" ]; then
            echo "Expected Next.js project files were not found in the archive."
            exit 1
          fi

          rsync -a --exclude='.git' --exclude='.github' "$project_root"/ ./
          rm -rf extracted
          test -f package.json
          test -f next.config.ts

          echo "Source files extracted. Project summary:"
          echo "Framework: $(node -p "require('./package.json').dependencies?.next || require('./package.json').devDependencies?.next || 'Next.js'")"
          echo "Environment variable names (values are not printed):"
          if [ -f .env.example ]; then sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' .env.example; fi
          echo "Project root files:"
          find . -maxdepth 2 -type f ! -path './.git/*' | sort | head -100

      - name: Commit extracted source files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Extract project source files"
          git push
